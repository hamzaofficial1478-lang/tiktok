appId: com.example.tiktokdownloader
productName: TikTok Downloader
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# Sidecars ship unpacked, outside the asar: a binary inside an asar archive
# cannot be exec'd. At runtime they resolve under process.resourcesPath/bin,
# which is exactly what SidecarResolver expects.
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'

asar: true
# better-sqlite3 is a native module; it must stay outside the archive so its
# .node file can be dlopen'd.
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Notarisation and signing are part of the release phase, not phase 1.
  hardenedRuntime: true

linux:
  target:
    - AppImage
  category: Utility
